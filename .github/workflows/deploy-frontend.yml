name: Deploy Frontend (Production)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Create .env.production
        run: |
          cat > .env.production <<EOF
          VITE_REDDIT_CLIENT_ID=${{ secrets.VITE_REDDIT_CLIENT_ID }}
          VITE_REDDIT_REDIRECT_URI=${{ secrets.VITE_REDDIT_REDIRECT_URI }}
          VITE_READ_API_BASE=${{ secrets.VITE_READ_API_BASE }}
          EOF

      - name: Build
        run: yarn build

      - name: Verify build output
        run: test -f dist/index.html

      - name: Prepare archive
        run: |
          tar -czf dist.tar.gz -C dist .

      - name: Ensure target directory exists
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            if [ ! -d "/var/www/reddzit-refresh" ]; then
              echo "⚠️  Directory /var/www/reddzit-refresh doesn't exist"
              if sudo -n true 2>/dev/null; then
                sudo mkdir -p /var/www/reddzit-refresh/dist
                sudo chown $USER:$USER /var/www/reddzit-refresh /var/www/reddzit-refresh/dist
              else
                echo "Please create it manually with:"
                echo "  sudo mkdir -p /var/www/reddzit-refresh/dist"
                echo "  sudo chown $USER:$USER /var/www/reddzit-refresh /var/www/reddzit-refresh/dist"
                exit 1
              fi
            fi
            # If we have sudo, ensure the user owns the path to avoid tar utime/mode issues
            if sudo -n true 2>/dev/null; then
              sudo chown -R $USER:$USER /var/www/reddzit-refresh
            fi
            mkdir -p /var/www/reddzit-refresh/dist
            # NOTE: the live dist is intentionally NOT cleaned here. It is replaced
            # atomically in the extract step only after a verified-good upload, so a
            # failed/partial scp can never leave the site serving an empty dist.

      - name: Upload assets
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: "dist.tar.gz"
          target: "/tmp"

      - name: Extract and finalize on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            BASE=/var/www/reddzit-refresh
            STAGING="$BASE/dist.incoming"
            # Stage the new build in a temp dir on the same filesystem so the final
            # swap is a cheap atomic rename and a broken build can't clobber the
            # live dist. --no-same-owner/permissions avoids tar utime/mode errors.
            rm -rf "$STAGING"
            mkdir -p "$STAGING"
            tar -xzf /tmp/dist.tar.gz -C "$STAGING" --no-same-owner --no-same-permissions -m
            # Fail the deploy WITHOUT touching the live dist if the build is broken.
            test -f "$STAGING/index.html"
            # Swap staging into place, keeping the previous build briefly for safety.
            rm -rf "$BASE/dist.old"
            if [ -d "$BASE/dist" ]; then
              mv "$BASE/dist" "$BASE/dist.old"
            fi
            mv "$STAGING" "$BASE/dist"
            rm -rf "$BASE/dist.old"
            rm -f /tmp/dist.tar.gz
            if sudo -n true 2>/dev/null; then
              sudo chown -R www-data:www-data "$BASE/dist"
              sudo systemctl reload nginx || true
            else
              echo "Skipping chown and nginx reload (no sudo)."
            fi
            echo "Deployment complete."

      - name: Restart read-api (SSR injector)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            echo "Restarting read-api to pick up updated dist/index.html..."
            if command -v pm2 >/dev/null 2>&1; then
              # cd into the app dir so dotenv finds /var/www/read-api/.env and
              # server.js's relative requires resolve regardless of pm2's cwd.
              cd /var/www/read-api
              if pm2 describe read-api >/dev/null 2>&1; then
                pm2 restart read-api --update-env
              else
                # Not in PM2 (e.g. lost after a crash/reboot) — register it fresh.
                pm2 start server.js --name read-api -i 2 --update-env
              fi
              # Persist the process list so the next deploy's restart finds it and
              # so it survives reboots via pm2 resurrect.
              pm2 save
              # A green deploy must NOT hide a dead API: poll until :3000 answers 200.
              ok=0
              for i in $(seq 1 15); do
                code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/ || true)
                if [ "$code" = "200" ]; then ok=1; break; fi
                sleep 1
              done
              if [ "$ok" != "1" ]; then
                echo "ERROR: read-api did not return 200 on :3000 after restart."
                pm2 logs read-api --lines 30 --nostream || true
                exit 1
              fi
              echo "read-api is up (200 on :3000)."
            elif sudo -n true 2>/dev/null && systemctl status read-api >/dev/null 2>&1; then
              sudo systemctl restart read-api
            else
              echo "read-api process manager not detected (PM2/systemd). Skipping restart."
            fi
